<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no,
                 viewport-fit=cover"
    >

    <title>ByLKI Raketen-Quiz</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="katex.min.css">

    <script defer src="katex.min.js"></script>
</head>

<body>

    <div id="startScreen">
        <div class="menu-box">
            <h1>🚀 Learnrocket</h1>

            <p>Wähle ein Thema aus!</p>

            <label for="questionSet">Thema:</label>

            <select id="questionSet">
                <option value="mathe">Mathematik</option>
                <option value="physik">Physik</option>
                <option value="rot1">
                    Drehbewegungen 🌀
                </option>
            </select>

            <button id="startBtn" class="main-btn">
                START
            </button>
        </div>
    </div>

    <div id="uiTopRight">
        <div id="muteToggle" class="ui-icon">🔇</div>
        <div id="infoToggle" class="ui-icon">?</div>
    </div>

    <div id="scoreDisplay">
        Punkte: 0
    </div>

    <div id="topHUD">
        <div id="astronautFeedback">
            <div id="astronautEmoji">👩‍🚀</div>
            <div id="astronautSpeech"></div>
        </div>

        <div id="questionDisplay">
            Lade...
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="answerContainer"></div>

    <div id="infoOverlay" class="overlay">
        <div class="info-box">
            <h2>Anleitung</h2>
            <p>Tippe direkt auf eine Antwort.</p>
            <p>
                Tippe danach irgendwohin,
                um die nächste Frage anzuzeigen.
            </p>
            <button id="closeInfoBtn" class="main-btn">
                OK
            </button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
